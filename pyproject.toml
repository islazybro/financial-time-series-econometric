[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econometria-financiera"
version = "0.1.0"
description = "Pipeline reproducible de series de tiempo financieras en Python para BBVA y Santander."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arch>=7.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "statsmodels>=0.14.0",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# reporting.py contiene plantillas Markdown con lineas extensas
"src/econometria_financiera/reporting.py" = ["E501"]
